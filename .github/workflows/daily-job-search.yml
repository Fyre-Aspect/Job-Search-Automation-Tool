# =============================================================================
# Daily Job Search Automation Workflow
# =============================================================================
# 
# This workflow runs automatically at 8:00 PM Eastern Time daily.
# It scrapes job listings, filters for entry-level roles, and emails new matches.
#
# Schedule: 8:00 PM Eastern Time
# - EST (Nov-Mar): 8 PM EST = 1:00 AM UTC next day
# - EDT (Mar-Nov): 8 PM EDT = 12:00 AM UTC
# 
# We use 1:00 AM UTC to cover EST. During EDT, it will run at 9 PM instead of 8 PM.
# This is an acceptable tradeoff for simplicity.
#
# Required Secrets (Settings > Secrets > Actions):
# - GMAIL_USER: Your Gmail address (e.g., aamirtinwala7@gmail.com)
# - GMAIL_APP_PASSWORD: 16-character app password from Google
#
# =============================================================================

name: Daily Job Search

on:
  # Scheduled run at 1:00 AM UTC (8:00 PM EST / 9:00 PM EDT)
  schedule:
    - cron: '0 1 * * *'
  
  # Allow manual triggering from GitHub Actions UI
  workflow_dispatch:
    inputs:
      debug_mode:
        description: 'Enable debug output'
        required: false
        default: 'false'
        type: boolean

# Ensure only one instance runs at a time
concurrency:
  group: job-search
  cancel-in-progress: false

jobs:
  search-and-notify:
    name: Search Jobs & Send Notifications
    runs-on: ubuntu-latest
    
    # Set timeout to prevent runaway processes
    timeout-minutes: 30
    
    steps:
      # =================================
      # SETUP
      # =================================
      
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          # Fetch all history for proper git operations
          fetch-depth: 0
          # Use the default GITHUB_TOKEN for push access
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # =================================
      # RESTORE DEDUPLICATION DATA
      # =================================
      
      - name: 📂 Ensure Data Directory Exists
        run: mkdir -p data
      
      # =================================
      # RUN JOB SEARCH
      # =================================
      
      - name: 🔍 Run Job Search
        id: job_search
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL || 'aamirtinwala7@gmail.com' }}
          # Optional: Adzuna API credentials
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          PYTHONUNBUFFERED: '1'
        run: |
          echo "Starting job search at $(date)"
          python main.py
          echo "Job search completed at $(date)"
      
      # =================================
      # PERSIST DEDUPLICATION DATA
      # =================================
      
      - name: 💾 Commit Updated Deduplication Data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Check if sent_jobs.json exists and has changes
          if [ -f "data/sent_jobs.json" ]; then
            git add data/sent_jobs.json
            
            # Only commit if there are changes
            if git diff --staged --quiet; then
              echo "No changes to deduplication data"
            else
              git commit -m "Update sent jobs database [skip ci]"
              git push
              echo "✓ Deduplication data committed"
            fi
          else
            echo "No deduplication data file found"
          fi
      
      # =================================
      # SUMMARY
      # =================================
      
      - name: 📊 Job Search Summary
        if: always()
        run: |
          echo "## Job Search Run Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Run Time:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "data/sent_jobs.json" ]; then
            TOTAL=$(python -c "import json; print(len(json.load(open('data/sent_jobs.json')).get('sent_hashes', [])))" 2>/dev/null || echo "unknown")
            echo "- **Total Jobs in Database:** $TOTAL" >> $GITHUB_STEP_SUMMARY
          fi
